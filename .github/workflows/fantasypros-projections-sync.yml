name: FantasyPros Projections Sync

on:
  schedule:
    - cron: "30 11 * * 2"
  workflow_dispatch:
    inputs:
      season_year:
        description: "NFL season year"
        required: false
        default: "2026"
      week:
        description: "NFL week for weekly projections"
        required: false
      projection_type:
        description: "Projection type: weekly or season"
        required: false
        default: "weekly"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MYFFL_API_BASE_URL: https://api.myfflapp.com
      MYFFL_FANTASYPROS_CSV_IMPORT_TOKEN: ${{ secrets.MYFFL_FANTASYPROS_CSV_IMPORT_TOKEN }}
      FANTASYPROS_SEASON_YEAR: ${{ github.event.inputs.season_year || '2026' }}
      FANTASYPROS_WEEK: ${{ github.event.inputs.week }}
      FANTASYPROS_PROJECTION_TYPE: ${{ github.event.inputs.projection_type || 'weekly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser automation dependency
        run: npm install --no-save puppeteer
      - name: Download and import FantasyPros projections
        run: node scripts/sync-fantasypros-projections.mjs
