name: FantasyPros CSV Sync

on:
  schedule:
    - cron: "20 11 * * 2,5"
  workflow_dispatch:
    inputs:
      season_year:
        description: "NFL season year"
        required: false
        default: "2026"
      scoring:
        description: "Ranking scoring model: STD, HALF, or PPR"
        required: false
        default: "PPR"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MYFFL_API_BASE_URL: https://api.myfflapp.com
      MYFFL_FANTASYPROS_CSV_IMPORT_TOKEN: ${{ secrets.MYFFL_FANTASYPROS_CSV_IMPORT_TOKEN }}
      FANTASYPROS_SEASON_YEAR: ${{ github.event.inputs.season_year || '2026' }}
      FANTASYPROS_SCORING: ${{ github.event.inputs.scoring || 'PPR' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser automation dependency
        run: npm install --no-save puppeteer@^25.0.0
      - name: Import FantasyPros CSV rankings
        run: node scripts/sync-fantasypros-csv.mjs
